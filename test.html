<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PushUp Counter - Clean White & Blue</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

  <!-- MediaPipe Pose & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      touch-action: manipulation;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen overflow-hidden flex flex-col items-center justify-center p-0 md:p-4">

  <!-- Mobile App Container Mockup -->
  <div class="relative w-full h-full md:max-w-md md:h-[90vh] md:rounded-[2.5rem] bg-black overflow-hidden shadow-2xl border-0 md:border-8 md:border-slate-800 flex flex-col">
    
    <!-- Video & Canvas Feed Background -->
    <div class="absolute inset-0 z-0">
      <video id="inputVideo" class="hidden" playsinline></video>
      <canvas id="outputCanvas" class="w-full h-full object-cover"></canvas>
    </div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 flex flex-col justify-between h-full p-4 select-none pointer-events-none">
      
      <!-- Top Bar: Status Badge & Reset -->
      <div class="flex items-center justify-between w-full pt-2">
        <!-- Form Status Badge -->
        <div id="formBadge" class="pointer-events-auto flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/90 backdrop-blur-md border border-blue-100 shadow-sm transition-all duration-200">
          <span id="formDot" class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
          <span id="formStatusText" class="text-xs font-bold text-slate-800 tracking-wide uppercase">Siap Mulai</span>
        </div>

        <!-- Reset Button -->
        <button id="btnReset" class="pointer-events-auto p-2.5 rounded-full bg-white/90 backdrop-blur-md border border-blue-100 text-blue-600 hover:bg-blue-50 active:scale-95 shadow-sm transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>

      <!-- Left Side Floating HUD Card (Clean White & Blue) -->
      <div class="self-start my-auto pointer-events-auto">
        <div class="bg-white/90 backdrop-blur-md border border-blue-100 rounded-3xl p-4 shadow-lg w-36 flex flex-col">
          <span class="text-[10px] font-extrabold text-slate-400 tracking-wider uppercase">Push-Up</span>
          <div class="flex items-baseline gap-1 my-0.5">
            <span id="repCounter" class="text-5xl font-black text-blue-600 font-mono-num leading-none tracking-tight">0</span>
            <span class="text-xs font-bold text-slate-400">reps</span>
          </div>

          <div class="h-px bg-slate-100 w-full my-2.5"></div>

          <!-- Stage State -->
          <div class="flex flex-col mb-2">
            <span class="text-[9px] font-bold text-slate-400 uppercase">Posisi</span>
            <span id="stageDisplay" class="text-sm font-black text-slate-800 uppercase font-mono-num">UP</span>
          </div>

          <!-- Siku (Elbow Angle) -->
          <div class="flex flex-col mb-2">
            <span class="text-[9px] font-bold text-slate-400 uppercase">Sudut Siku</span>
            <div class="flex items-baseline gap-0.5">
              <span id="elbowAngleDisplay" class="text-base font-extrabold text-sky-600 font-mono-num">--</span>
              <span class="text-xs text-sky-500 font-bold">°</span>
            </div>
          </div>

          <!-- Pinggul / Plank (Hip Angle) -->
          <div class="flex flex-col">
            <span class="text-[9px] font-bold text-slate-400 uppercase">Sudut Pinggul</span>
            <div class="flex items-baseline gap-0.5">
              <span id="hipAngleDisplay" class="text-base font-extrabold text-slate-700 font-mono-num">--</span>
              <span class="text-xs text-slate-500 font-bold">°</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Bar: Duration & Cadence (Pill Card) -->
      <div class="w-full pb-2 pointer-events-auto">
        <div class="bg-white/90 backdrop-blur-md border border-blue-100 rounded-2xl p-3.5 shadow-lg flex items-center justify-around">
          
          <!-- Durasi Latihan -->
          <div class="flex items-center gap-2.5">
            <div class="p-2 bg-blue-50 text-blue-600 rounded-xl">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <div>
              <div class="text-[9px] font-bold text-slate-400 uppercase">Durasi</div>
              <div id="durationDisplay" class="text-sm font-extrabold text-slate-800 font-mono-num">00:00</div>
            </div>
          </div>

          <!-- Separator Line -->
          <div class="w-px h-7 bg-slate-200"></div>

          <!-- Kecepatan RPM -->
          <div class="flex items-center gap-2.5">
            <div class="p-2 bg-blue-50 text-blue-600 rounded-xl">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            </div>
            <div>
              <div class="text-[9px] font-bold text-slate-400 uppercase">Kecepatan</div>
              <div class="flex items-baseline gap-1">
                <span id="rpmDisplay" class="text-sm font-extrabold text-slate-800 font-mono-num">0.0</span>
                <span class="text-[10px] font-bold text-slate-400">RPM</span>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script>
    const videoElement = document.getElementById('inputVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');

    // UI Elements
    const repCounterEl = document.getElementById('repCounter');
    const stageDisplayEl = document.getElementById('stageDisplay');
    const elbowAngleEl = document.getElementById('elbowAngleDisplay');
    const hipAngleEl = document.getElementById('hipAngleDisplay');
    const formBadge = document.getElementById('formBadge');
    const formDot = document.getElementById('formDot');
    const formStatusText = document.getElementById('formStatusText');
    const durationEl = document.getElementById('durationDisplay');
    const rpmEl = document.getElementById('rpmDisplay');
    const btnReset = document.getElementById('btnReset');

    // State Variables
    let reps = 0;
    let stage = 'UP';
    let isTracking = false;
    let startTime = null;
    let timerInterval = null;

    // Web Audio Synthesizer (Beep feedback)
    let audioCtx = null;
    function playBeep(freq = 600, duration = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    // Kalkulasi Sudut (Vektor 3 Titik)
    function calculateAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360.0 - angle;
      return Math.round(angle);
    }

    function startTimerIfNeeded() {
      if (!isTracking) {
        isTracking = true;
        startTime = Date.now();
        timerInterval = setInterval(() => {
          const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
          const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
          const secs = String(elapsedSec % 60).padStart(2, '0');
          durationEl.innerText = `${mins}:${secs}`;

          if (elapsedSec > 0) {
            rpmEl.innerText = ((reps / elapsedSec) * 60).toFixed(1);
          }
        }, 1000);
      }
    }

    function onResults(results) {
      if (!results.poseLandmarks) {
        formStatusText.innerText = "Tubuh Tidak Terdeteksi";
        formDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse";
        return;
      }

      // Sync Canvas Dimensions
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Gambar Camera Feed Mirror
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // Gambar Skeleton Clean Blue
      drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#60a5fa', lineWidth: 3 });
      drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#2563eb', fillColor: '#ffffff', lineWidth: 2, radius: 4 });

      canvasCtx.restore();

      const lm = results.poseLandmarks;

      // Prioritas Sisi Lengan yang Paling Jelas Terlihat
      const leftConf = (lm[11].visibility + lm[13].visibility + lm[15].visibility) / 3;
      const rightConf = (lm[12].visibility + lm[14].visibility + lm[16].visibility) / 3;

      let shoulder, elbow, wrist, hip, ankle;
      if (leftConf > rightConf) {
        shoulder = lm[11]; elbow = lm[13]; wrist = lm[15]; hip = lm[23]; ankle = lm[27];
      } else {
        shoulder = lm[12]; elbow = lm[14]; wrist = lm[16]; hip = lm[24]; ankle = lm[28];
      }

      // Kalkulasi Sudut Siku & Pinggul
      const elbowAngle = calculateAngle(shoulder, elbow, wrist);
      const hipAngle = calculateAngle(shoulder, hip, ankle);

      elbowAngleEl.innerText = elbowAngle;
      hipAngleEl.innerText = hipAngle;

      const isStraightPlank = hipAngle >= 150;

      // Status Form & Feedback
      if (!isStraightPlank) {
        formStatusText.innerText = "Luruskan Badan";
        formDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
        hipAngleEl.className = "text-base font-extrabold text-amber-500 font-mono-num";
      } else {
        hipAngleEl.className = "text-base font-extrabold text-slate-700 font-mono-num";
        if (stage === 'DOWN') {
          formStatusText.innerText = "Dorong ke Atas";
          formDot.className = "w-2.5 h-2.5 rounded-full bg-sky-500 animate-pulse";
        } else {
          formStatusText.innerText = "Good Form";
          formDot.className = "w-2.5 h-2.5 rounded-full bg-blue-600";
        }
      }

      // Logika Repetisi Push-Up
      if (elbowAngle <= 90) {
        startTimerIfNeeded();
        if (stage === 'UP') {
          stage = 'DOWN';
          stageDisplayEl.innerText = 'DOWN';
          stageDisplayEl.className = 'text-sm font-black text-sky-600 uppercase font-mono-num';
        }
      }

      if (elbowAngle >= 155 && stage === 'DOWN') {
        stage = 'UP';
        stageDisplayEl.innerText = 'UP';
        stageDisplayEl.className = 'text-sm font-black text-slate-800 uppercase font-mono-num';

        // Hanya tambah jika posisi tubuh lurus (anti-curang)
        if (isStraightPlank) {
          reps += 1;
          repCounterEl.innerText = reps;
          playBeep(880, 0.15); // Audio beep sukses (nada A5)
          
          if (navigator.vibrate) {
            navigator.vibrate(60); // Getar ponsel saat repetisi sah
          }

          if (startTime) {
            const elapsed = Math.max((Date.now() - startTime) / 1000, 1);
            rpmEl.innerText = ((reps / elapsed) * 60).toFixed(1);
          }
        }
      }
    }

    // Inisialisasi MediaPipe Pose
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    // Setup Kamera Depan (User)
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 1280,
      height: 720,
      facingMode: 'user'
    });

    camera.start().catch((err) => {
      formStatusText.innerText = "Kamera Terkunci";
      formDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
      console.error(err);
    });

    // Reset Trigger
    btnReset.addEventListener('click', () => {
      clearInterval(timerInterval);
      reps = 0;
      stage = 'UP';
      isTracking = false;
      startTime = null;

      repCounterEl.innerText = "0";
      stageDisplayEl.innerText = "UP";
      stageDisplayEl.className = "text-sm font-black text-slate-800 uppercase font-mono-num";
      elbowAngleEl.innerText = "--";
      hipAngleEl.innerText = "--";
      durationEl.innerText = "00:00";
      rpmEl.innerText = "0.0";
      formStatusText.innerText = "Siap Mulai";
      formDot.className = "w-2.5 h-2.5 rounded-full bg-blue-600";
    });
  </script>
</body>
</html>
